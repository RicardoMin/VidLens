<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370"><rect width="100%" height="100%" fill="#f7fafc" rx="18"/><g font-family="system-ui, sans-serif" fill="#25384b"><text x="36" y="48" font-size="26" fill="#25384b" text-anchor="start">同一张图片，从一次网络预测走到最终检测</text><rect x="32" y="105" width="222" height="125" fill="#eaf3f8" stroke="#c7d5df" stroke-width="2" rx="9"/><text x="143" y="150" font-size="23" fill="#25384b" text-anchor="middle">输入整图</text><text x="143" y="192" font-size="17" fill="#25384b" text-anchor="middle">448 × 448</text><text x="270" y="175" font-size="26" fill="#25384b" text-anchor="middle">→</text><rect x="286" y="105" width="222" height="125" fill="#fff4e8" stroke="#c7d5df" stroke-width="2" rx="9"/><text x="397" y="150" font-size="23" fill="#25384b" text-anchor="middle">网络提取特征</text><text x="397" y="192" font-size="17" fill="#25384b" text-anchor="middle">24 卷积 + 2 全连接</text><text x="524" y="175" font-size="26" fill="#25384b" text-anchor="middle">→</text><rect x="540" y="105" width="222" height="125" fill="#eaf3f8" stroke="#c7d5df" stroke-width="2" rx="9"/><text x="651" y="150" font-size="23" fill="#25384b" text-anchor="middle">所有格子输出</text><text x="651" y="192" font-size="17" fill="#25384b" text-anchor="middle">7 × 7 × 30</text><text x="778" y="175" font-size="26" fill="#25384b" text-anchor="middle">→</text><rect x="794" y="105" width="222" height="125" fill="#fff4e8" stroke="#c7d5df" stroke-width="2" rx="9"/><text x="905" y="150" font-size="23" fill="#25384b" text-anchor="middle">打分与去重</text><text x="905" y="192" font-size="17" fill="#25384b" text-anchor="middle">类别得分 → NMS</text><text x="40" y="290" font-size="22" fill="#25384b" text-anchor="start">网格划分安排责任与输出，不会把图片裁成 49 份单独运行。</text><text x="40" y="330" font-size="22" fill="#25384b" text-anchor="start">一次网络计算之后，候选框仍需筛选。</text></g></svg>