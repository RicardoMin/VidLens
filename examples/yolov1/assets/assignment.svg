<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480"><rect width="100%" height="100%" fill="#f7fafc" rx="18"/><g font-family="system-ui, sans-serif" fill="#25384b"><text x="32" y="43" font-size="25" fill="#25384b" text-anchor="start">训练分工：比较每个预测框与同一真实框的 IoU</text><rect x="40" y="75" width="455" height="330" fill="#ffffff" stroke="#c7d5df" stroke-width="2" rx="9"/><text x="60" y="112" font-size="24" fill="#25384b" text-anchor="start">预测器 A</text><rect x="164.0" y="169.0" width="96.0" height="120.0" fill="none" stroke="#379466" stroke-width="4" rx="0"/><rect x="165.5" y="167.5" width="96.0" height="120.0" fill="none" stroke="#2987a0" stroke-width="3" rx="0"/><text x="65" y="345" font-size="23" fill="#2987a0" text-anchor="start">与真值 IoU = 0.946</text><text x="65" y="382" font-size="20" fill="#25384b" text-anchor="start">承担当前目标的坐标学习</text><rect x="540" y="75" width="455" height="330" fill="#ffffff" stroke="#c7d5df" stroke-width="2" rx="9"/><text x="560" y="112" font-size="24" fill="#25384b" text-anchor="start">预测器 B</text><rect x="664.0" y="169.0" width="96.0" height="120.0" fill="none" stroke="#379466" stroke-width="4" rx="0"/><rect x="640.0" y="145.0" width="96.0" height="120.0" fill="none" stroke="#d98b32" stroke-width="3" rx="0"/><text x="565" y="345" font-size="23" fill="#d98b32" text-anchor="start">与真值 IoU = 0.429</text><text x="565" y="382" font-size="20" fill="#25384b" text-anchor="start">不承担该目标的坐标回归</text><text x="40" y="448" font-size="21" fill="#25384b" text-anchor="start">绿色：真实框。比较对象是“预测框 ↔ 真实框”。</text></g></svg>